<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102c25" />
    <title data-copy="text.151">PROMY POST OFFICE</title>
    <style>
      :root {
        --ink: #122d24;
        --pine: #103e30;
        --dark: #09261e;
        --emerald: #1c7658;
        --mint: #d9e9d7;
        --lime: #dcf49a;
        --cream: #f8f6e9;
        --gold: #ffd99a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "DM Sans", "Noto Sans KR", sans-serif;
        background: #0b2923;
        color: #fff;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #e6ffb1;
        outline-offset: 2px;
      }
      #app,
      #viewport {
        position: fixed;
        inset: 0;
      }
      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: 0;
      }
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            180deg,
            #071c1d7b 0%,
            transparent 28%,
            transparent 60%,
            #09231b75 100%
          ),
          radial-gradient(ellipse at center, transparent 40%, #0a2b2238 100%);
      }
      .glass {
        background: rgba(11, 39, 32, 0.67);
        border: 1px solid rgba(242, 255, 227, 0.23);
        box-shadow: 0 9px 30px #00120b27;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      header {
        position: fixed;
        z-index: 15;
        top: 18px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        pointer-events: none;
      }
      header > * {
        pointer-events: auto;
      }
      .brand {
        display: flex;
        gap: 13px;
        align-items: center;
        border-radius: 16px;
        padding: 12px 18px;
      }
      .brand-mark {
        height: 38px;
        width: 38px;
        border-radius: 10px;
        background: linear-gradient(145deg, #2b9871, #b8eb98);
        display: grid;
        place-items: center;
        color: #103c2d;
        font-weight: 900;
        font-size: 18px;
      }
      .brand strong {
        display: block;
        font-size: 14px;
        letter-spacing: 0.09em;
      }
      .brand small {
        font-size: 10px;
        color: #bed7c4;
        letter-spacing: 0.1em;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .head-btn {
        color: #fff;
        border: 1px solid #eaffd13a;
        border-radius: 13px;
        padding: 12px 15px;
        font-size: 12px;
        font-weight: 700;
      }
      .head-btn b {
        color: #d6ff9e;
      }
      .avatar-pill {
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 12px;
        color: #e2f4e6;
      }
      .avatar-pill strong {
        color: #e5ffb0;
      }
      .hero-copy {
        position: fixed;
        top: 122px;
        left: 29px;
        z-index: 5;
        pointer-events: none;
        text-shadow: 0 3px 25px #0a322880;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 800;
        color: #d8ffab;
      }
      .hero-copy h1 {
        font-size: clamp(27px, 3.5vw, 51px);
        letter-spacing: -0.075em;
        line-height: 1.25;
        margin: 11px 0 12px;
        font-weight: 900;
      }
      .hero-copy p {
        font-size: 13px;
        color: #e5f4e4;
        line-height: 1.7;
        margin: 0;
      }
      .score {
        position: fixed;
        z-index: 9;
        right: 20px;
        top: 92px;
        width: 194px;
        padding: 16px 18px;
        border-radius: 17px;
      }
      .score small {
        font-size: 10px;
        color: #b5d2c0;
        letter-spacing: 0.05em;
      }
      .score strong {
        display: block;
        font-size: 34px;
        color: #e6ffa9;
        letter-spacing: -0.05em;
        margin: 1px 0;
      }
      .score span {
        font-size: 11px;
        color: #d2e2d4;
      }
      .score .progress {
        height: 4px;
        background: #ffffff26;
        border-radius: 10px;
        margin: 12px 0 7px;
        overflow: hidden;
      }
      .score .progress i {
        display: block;
        width: 0;
        height: 100%;
        background: #dbf3a0;
        transition: width 0.5s;
      }
      .bottom-ui {
        position: fixed;
        z-index: 20;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 7px;
        border-radius: 19px;
        padding: 8px;
        max-width: calc(100% - 25px);
      }
      .bottom-ui button {
        min-width: 96px;
        color: #eaf8e9;
        background: transparent;
        border: 0;
        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 5px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .bottom-ui button:hover,
      .bottom-ui button.active {
        background: #ddf89b;
        color: #133a2b;
      }
      .bottom-ui button em {
        font-size: 20px;
        font-style: normal;
      }
      .side-tools {
        position: fixed;
        z-index: 12;
        right: 20px;
        bottom: 30px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .round {
        background: #0b2e25ae;
        color: #effbe9;
        border: 1px solid #eaffde4b;
        border-radius: 12px;
        height: 46px;
        min-width: 46px;
        padding: 0 12px;
        font-size: 19px;
      }
      .minimap {
        position: fixed;
        z-index: 10;
        top: 255px;
        right: 20px;
        width: 194px;
        border-radius: 17px;
        padding: 12px;
      }
      .minimap h3 {
        font-size: 11px;
        margin: 0 0 10px;
        font-weight: 700;
        color: #e2f3df;
      }
      .mapgrid {
        position: relative;
        height: 125px;
        background: radial-gradient(circle at center, #3f8b69, #1c5947);
        border-radius: 11px;
        overflow: hidden;
        border: 1px solid #ffffff22;
      }
      .mapgrid:before,
      .mapgrid:after {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        width: 13px;
        height: 100%;
        background: #dad3b385;
        transform: translateX(-50%);
      }
      .mapgrid:after {
        transform: translateX(-50%) rotate(90deg);
      }
      .mapdot {
        position: absolute;
        z-index: 2;
        border: 1px solid #ffffff77;
        border-radius: 50%;
        width: 14px;
        height: 14px;
        background: #d9f1c6;
        transform: translate(-50%, -50%);
        font-size: 0;
      }
      .mapdot.mail {
        background: #ca6258;
        width: 20px;
        height: 20px;
      }
      .mapdot.user {
        background: #fcdf7f;
        width: 9px;
        height: 9px;
        box-shadow: 0 0 0 4px #f6f4d650;
      }
      .map-label {
        font-size: 10px;
        color: #cce5cd;
        margin-top: 7px;
      }
      .toast {
        position: fixed;
        z-index: 45;
        left: 50%;
        bottom: 117px;
        transform: translateX(-50%) translateY(16px);
        border-radius: 13px;
        padding: 13px 20px;
        white-space: nowrap;
        font-size: 13px;
        opacity: 0;
        transition: 0.25s;
        pointer-events: none;
        max-width: 95vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .hint {
        position: fixed;
        z-index: 10;
        left: 25px;
        bottom: 27px;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 11px;
        color: #e8f6e6;
        line-height: 1.7;
      }
      .hint b {
        font-size: 12px;
        color: #e6fba6;
      }
      .interact {
        position: fixed;
        z-index: 18;
        left: 50%;
        top: 58%;
        transform: translate(-50%, -50%);
        border: 1px solid #d9fabd88;
        border-radius: 16px;
        padding: 14px 18px;
        color: #fff;
        display: none;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
      }
      .interact.show {
        display: flex;
      }
      .interact kbd {
        padding: 5px 9px;
        background: #e3f7ad;
        color: #244633;
        border-radius: 6px;
        font-weight: 800;
      }
      .modal-back {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: #031b14a8;
        backdrop-filter: blur(10px);
        padding: 16px;
      }
      .modal-back.open {
        display: flex;
      }
      .modal {
        width: min(505px, 100%);
        max-height: 89vh;
        overflow: auto;
        background: linear-gradient(155deg, #f7f8ef, #e7eee5);
        border: 1px solid #d7e6d5;
        box-shadow: 0 26px 100px #001b1170;
        border-radius: 22px;
        color: #183c2a;
        padding: 29px;
      }
      .modal-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .modal .eyebrow {
        color: #28795b;
      }
      .modal h2 {
        letter-spacing: -0.06em;
        font-size: 30px;
        margin: 9px 0;
      }
      .modal p {
        font-size: 14px;
        line-height: 1.85;
        color: #627d68;
      }
      .close {
        border: 0;
        background: none;
        color: #657a67;
        font-size: 25px;
      }
      .choice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin: 21px 0;
      }
      .choice-grid button {
        border: 1px solid #c9dac9;
        background: #fff;
        border-radius: 11px;
        padding: 15px 11px;
        color: #214d3a;
        text-align: left;
        font-size: 13px;
        min-height: 75px;
      }
      .choice-grid button b {
        display: block;
        font-size: 15px;
        margin-bottom: 5px;
      }
      .choice-grid button.chosen {
        background: #1f7254;
        color: #fff;
        border-color: #1f7254;
      }
      .primary {
        background: #195b45;
        color: white;
        border: 0;
        border-radius: 11px;
        padding: 15px 20px;
        font-weight: 800;
        width: 100%;
        font-size: 14px;
      }
      .primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .mini-note {
        font-size: 11px !important;
        color: #809585 !important;
      }
      .dialog-chat {
        background: #dcead9;
        border-radius: 15px 15px 15px 4px;
        padding: 14px 16px;
        line-height: 1.9;
        margin: 15px 0;
        font-size: 14px;
      }
      .two-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
      }
      .two-buttons button {
        border: 1px solid #bad3bf;
        border-radius: 11px;
        background: #fff;
        color: #1e6147;
        padding: 13px;
        font-weight: 700;
        font-size: 13px;
      }
      .letter-card {
        padding: 15px;
        border: 1px solid #d0dfd0;
        background: #fff;
        border-radius: 12px;
      }
      .status {
        position: fixed;
        z-index: 8;
        left: 28px;
        top: 285px;
        color: #dfefe0;
        font-size: 11px;
        max-width: 275px;
        line-height: 1.8;
        pointer-events: none;
      }
      .status strong {
        display: block;
        font-size: 14px;
        color: #e5ffac;
      }
      .demo-label {
        position: fixed;
        z-index: 6;
        bottom: 5px;
        right: 20px;
        font-size: 9px;
        color: #c3dbc7a9;
        text-shadow: 0 1px 5px #002517;
      }
      .loading {
        position: fixed;
        z-index: 100;
        inset: 0;
        background: linear-gradient(125deg, #092921, #22674d);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 30px;
        gap: 10px;
      }
      .loading h2 {
        font-size: 32px;
        letter-spacing: -0.07em;
      }
      .loading small {
        max-width: 380px;
        line-height: 1.8;
        color: #b8dbc7;
      }
      .loadbar {
        width: 190px;
        height: 3px;
        background: #ffffff22;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 10px;
      }
      .loadbar:after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #d9fa99;
        animation: load 1.5s infinite ease-in-out;
      }
      @keyframes load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(330%);
        }
      }
      .zone-label {
        position: fixed;
        z-index: 10;
        top: 85px;
        left: 50%;
        transform: translateX(-50%);
        background: #0a3329aa;
        border: 1px solid #ffffff2d;
        padding: 10px 18px;
        border-radius: 60px;
        color: #eef6df;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .joystick {
        position: fixed;
        z-index: 22;
        left: 30px;
        bottom: 115px;
        width: 110px;
        height: 110px;
        border: 2px solid #e8fbe264;
        border-radius: 50%;
        background: #0a2e2590;
        display: none;
        touch-action: none;
      }
      .joystick i {
        position: absolute;
        top: 32px;
        left: 32px;
        height: 42px;
        width: 42px;
        background: #dcf7a1b8;
        border-radius: 50%;
        pointer-events: none;
      }
      .mobile-action {
        position: fixed;
        bottom: 129px;
        right: 22px;
        z-index: 24;
        border-radius: 50%;
        height: 64px;
        width: 64px;
        background: #dff5a1;
        color: #173d2c;
        border: 0;
        font-weight: 900;
        display: none;
        box-shadow: 0 6px 20px #0007;
      }
      .point {
        cursor: pointer;
      }
      @media (max-width: 900px) {
        header {
          left: 10px;
          top: 10px;
          right: 10px;
        }
        .brand {
          padding: 8px 11px;
        }
        .brand-mark {
          height: 30px;
          width: 30px;
        }
        .brand strong {
          font-size: 11px;
        }
        .brand small {
          font-size: 8px;
        }
        .avatar-pill {
          display: none;
        }
        .head-btn {
          font-size: 11px;
          padding: 10px;
        }
        .hero-copy {
          left: 16px;
          top: 95px;
        }
        .hero-copy h1 {
          font-size: 28px;
        }
        .hero-copy p {
          font-size: 11px;
        }
        .score {
          top: 93px;
          right: 10px;
          width: 136px;
          padding: 10px;
        }
        .score strong {
          font-size: 25px;
        }
        .minimap,
        .hint,
        .side-tools {
          display: none;
        }
        .bottom-ui {
          bottom: 8px;
          width: calc(100% - 12px);
          justify-content: space-between;
          gap: 0;
          padding: 5px;
        }
        .bottom-ui button {
          min-width: unset;
          flex: 1;
          padding: 8px 2px;
          font-size: 10px;
        }
        .bottom-ui button em {
          font-size: 17px;
        }
        .joystick,
        .mobile-action {
          display: block;
        }
        .toast {
          bottom: 83px;
          font-size: 11px;
        }
        .status {
          top: auto;
          bottom: 101px;
          left: 12px;
          font-size: 10px;
          max-width: 190px;
        }
        .zone-label {
          display: none;
        }
        .demo-label {
          display: none;
        }
      }
      @media (max-width: 420px) {
        .header-right .head-btn:first-child {
          display: none;
        }
        .score {
          top: 82px;
        }
        .hero-copy h1 {
          font-size: 23px;
        }
        .hero-copy {
          top: 92px;
        }
        .hero-copy p {
          max-width: 165px;
        }
      }

      /* Art direction v0.4: cinematic emerald dusk, editorial microcopy and emotional beats */
      #vignette {
        background:
          linear-gradient(
            180deg,
            #021c1870,
            transparent 30%,
            transparent 57%,
            #06251a88
          ),
          radial-gradient(ellipse at center, transparent 30%, #082d294d 100%);
        transition: filter 1.4s;
      }
      body.moment #vignette {
        filter: brightness(1.13);
      }
      .hero-copy h1 {
        font-weight: 800;
        text-shadow: 0 4px 38px #041e19aa;
      }
      .hero-copy .storyline {
        margin-top: 18px;
        padding-left: 13px;
        border-left: 2px solid #e4f5a1;
        font-size: 12px;
        color: #e7f3da;
        line-height: 1.9;
        max-width: 280px;
      }
      .cinematic-caption {
        position: fixed;
        z-index: 35;
        left: 50%;
        top: 22%;
        transform: translate(-50%, 18px);
        width: min(710px, 90vw);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.75s,
          transform 0.75s;
        text-shadow: 0 5px 34px #0a2218;
      }
      .cinematic-caption.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .cinematic-caption .kicker {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: #e7fbab;
      }
      .cinematic-caption strong {
        display: block;
        font-size: clamp(29px, 4.5vw, 62px);
        letter-spacing: -0.065em;
        line-height: 1.3;
        margin: 14px 0;
        color: #fffdf0;
      }
      .cinematic-caption span {
        font-size: clamp(12px, 1.3vw, 17px);
        color: #e5f3e7;
      }
      .moment-timeline {
        position: fixed;
        left: 50%;
        bottom: 115px;
        transform: translateX(-50%);
        z-index: 11;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0.88;
        white-space: nowrap;
      }
      .moment-timeline .beat {
        font-size: 10px;
        border: 1px solid #e6ffd93b;
        border-radius: 20px;
        color: #d9e5d6;
        padding: 7px 11px;
        background: #0e3e31a6;
      }
      .moment-timeline .beat.on {
        background: #ddf7a2;
        color: #20432d;
        border-color: #ddf7a2;
      }
      .art-tag {
        position: fixed;
        z-index: 6;
        left: 27px;
        bottom: 112px;
        max-width: 280px;
        color: #e1ebdcbb;
        font-size: 10px;
        letter-spacing: 0.05em;
        line-height: 1.7;
        text-shadow: 0 2px 8px #001a10;
      }
      @media (max-width: 900px) {
        .hero-copy .storyline {
          display: none;
        }
        .moment-timeline {
          bottom: 76px;
        }
        .moment-timeline .beat {
          font-size: 9px;
          padding: 5px 8px;
        }
        .cinematic-caption {
          top: 25%;
        }
        .art-tag {
          display: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three.module.js",
          "three/addons/": "./assets/vendor/addons/"
        }
      }
    </script>
    <link rel="stylesheet" href="./src/ui/daily.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="vignette"></div>
      <header>
        <div class="brand glass">
          <div class="brand-mark">P</div>
          <div>
            <strong
              ><span data-copy="text.152"></span
              ><span style="color: #ddf69f">· PROMY POST OFFICE</span></strong
            ><small>DB · THE PROMISE OF BEING YOU</small>
          </div>
        </div>
        <div class="header-right">
          <div class="avatar-pill glass" id="identity">
            <span data-copy="text.153"></span>
          </div>
          <button class="head-btn glass" id="nightBtn">
            ☾ <b>21:00</b><span data-copy="text.154"></span></button
          ><button class="head-btn glass" id="soundBtn">
            <span data-copy="text.155"></span>
          </button>
        </div>
      </header>
      <div class="hero-copy">
        <div class="eyebrow">2027 · PROMISE EXPERIENCE</div>
        <h1>
          <span data-copy="text.156"></span><br /><span
            data-copy="text.157"
          ></span>
        </h1>
        <p>
          <span data-copy="text.158"></span><br /><span
            data-copy="text.159"
          ></span>
        </p>
        <div class="storyline">
          <span data-copy="text.160"></span><br /><span
            data-copy="text.161"
          ></span>
        </div>
      </div>
      <div class="score glass">
        <small><span data-copy="text.162"></span></small
